<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64">

    <!-- Blue Circle -->
    <circle
        cx="32"
        cy="32"
        r="28"
        fill="#0B5FA5"/>

    <!-- Chemical Drum -->
    <ellipse
        cx="26"
        cy="20"
        rx="8"
        ry="2.5"
        fill="white"/>

    <rect
        x="18"
        y="20"
        width="16"
        height="20"
        rx="2"
        fill="white"/>

    <ellipse
        cx="26"
        cy="40"
        rx="8"
        ry="2.5"
        fill="white"/>

    <!-- Drum Bands -->
    <rect
        x="18"
        y="25"
        width="16"
        height="1.8"
        fill="#0B5FA5"/>

    <rect
        x="18"
        y="33"
        width="16"
        height="1.8"
        fill="#0B5FA5"/>

    <!-- Calendar -->
    <rect
        x="36"
        y="24"
        width="12"
        height="12"
        rx="2"
        fill="white"/>

    <!-- Calendar Header -->
    <rect
        x="36"
        y="24"
        width="12"
        height="3"
        fill="#0B5FA5"/>

    <!-- Calendar Rings -->
    <rect
        x="38"
        y="21"
        width="1.5"
        height="4"
        rx="0.5"
        fill="white"/>

    <rect
        x="44.5"
        y="21"
        width="1.5"
        height="4"
        rx="0.5"
        fill="white"/>

    <!-- Calendar Dot -->
    <circle
        cx="42"
        cy="31"
        r="1.3"
        fill="#0B5FA5"/>

</svg>