<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64">

    <!-- Background -->
    <circle
        cx="32"
        cy="32"
        r="28"
        fill="#0B5FA5"/>

    <!-- Chemical Drum -->
    <ellipse
        cx="27"
        cy="19"
        rx="8"
        ry="2.5"
        fill="white"/>

    <rect
        x="19"
        y="19"
        width="16"
        height="20"
        rx="2"
        fill="white"/>

    <ellipse
        cx="27"
        cy="39"
        rx="8"
        ry="2.5"
        fill="white"/>

    <!-- Drum Bands -->
    <rect
        x="19"
        y="24"
        width="16"
        height="1.8"
        fill="#0B5FA5"/>

    <rect
        x="19"
        y="32"
        width="16"
        height="1.8"
        fill="#0B5FA5"/>

    <!-- Dollar Coin -->
    <circle
        cx="43"
        cy="36"
        r="8"
        fill="white"/>

    <text
        x="43"
        y="40"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="11"
        font-weight="700"
        fill="#0B5FA5">$</text>

</svg>